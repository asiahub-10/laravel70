; ============================================================
; php.ini — PHP 8.5, tuned for Laravel / Laravel Herd
; ============================================================
; Drop this in as your php.ini (or merge the relevant directives
; into Herd's per-version php.ini, e.g.
; ~/Library/Application Support/Herd/config/php/85/php.ini on macOS,
; or %USERPROFILE%\.config\herd\config\php\85\php.ini on Windows).
; After changing, run `herd restart` (or restart the PHP-FPM/valet
; service) so it takes effect.
; ============================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

; ---- Error handling ----
; Set display_errors = Off and error_reporting to a stricter level
; in production. These values are dev-friendly (Herd/local use).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "php_errors.log"
ignore_repeated_errors = Off
html_errors = On

; ---- Resource limits ----
max_execution_time = 120
max_input_time = 120
memory_limit = 512M

; ---- Data handling ----
max_input_vars = 5000
post_max_size = 100M
default_charset = "UTF-8"

; ---- File uploads ----
file_uploads = On
upload_max_filesize = 100M
max_file_uploads = 40

; ---- Paths / misc ----
; sys_temp_dir usually doesn't need setting on Herd; leave commented
; unless you hit permission issues with uploads/queue temp files.
;sys_temp_dir = "/tmp"

; ---- Fopen wrappers ----
allow_url_fopen = On
allow_url_include = Off

; ---- Timezone ----
; Laravel also sets this via config/app.php, but PHP-level timezone
; should match to avoid warnings from date() calls outside Laravel.
date.timezone = "UTC"

; ---- Realpath cache (helps Artisan / Composer autoload perf) ----
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ---- Session ----
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 0 ; set to 1 when served over HTTPS (Herd's *.test sites can use 1)
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1440

; ============================================================
; Extension directory — MUST match where your php_*.dll files
; actually live. For this install that's C:\php85\ext.
; ============================================================
extension_dir = "C:\php85\ext"

; ============================================================
; Required / commonly-used extensions for Laravel
;
; The following are compiled into PHP core by default in modern
; builds and need NO extension= line (loading them will just error
; "already loaded" or do nothing useful): ctype, dom, filter, iconv,
; pcre, pdo, session, simplexml, sodium, tokenizer, xml, xmlwriter.
;
; bcmath and redis are NOT present in this ext folder — see notes
; below. Uncomment them once you've added the matching DLLs.
; ============================================================
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_pgsql
extension=pdo_sqlite
extension=zip

; ---- Not present in C:\php85\ext — add the DLL, then uncomment ----
; bcmath is required by Laravel/Composer for some packages (e.g. math-heavy
; validation). Get it from a full windows.php.net PHP 8.5 NTS x64 zip.
;extension=bcmath
; redis is never bundled with core PHP — get the matching PHP 8.5 NTS x64
; build from https://pecl.php.net/package/redis and drop php_redis.dll
; into C:\php85\ext, then uncomment this line.
;extension=redis

; ============================================================
; OPcache — big win for Laravel performance, safe defaults for
; local dev (Herd) with fast file-change detection enabled.
; For production, set validate_timestamps=0 and deploy with a
; cache-clear step (php artisan optimize / opcache reset).
; ============================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; ============================================================
; Xdebug (optional — leave commented unless you need step debugging;
; enabling it slows down Artisan/Composer noticeably)
; ============================================================
;[xdebug]
;zend_extension = xdebug
;xdebug.mode = debug
;xdebug.start_with_request = trigger
;xdebug.client_host = 127.0.0.1
;xdebug.client_port = 9003

; ============================================================
; Mail (Herd includes a local mail catcher; Laravel's MAIL_MAILER
; config in .env is what actually routes mail, this is just the
; PHP-level fallback for mail())
; ============================================================
[mail function]
SMTP = localhost
smtp_port = 1025
sendmail_path = /usr/sbin/sendmail -t -i
